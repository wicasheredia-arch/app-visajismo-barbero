<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISAGE — Diagnóstico de visagismo</title>
<style>
/*
  VISAGE — identidad visual del diagnostico de visagismo.

  Paleta: onyx/carbon (fondo), champan (acento de marca, uso
  discreto) y marfil (texto). Los estados SOLIDO/ACEPTABLE/DEBIL
  usan un juego semantico propio, deliberadamente distinto del
  champan de marca, para que nunca se confundan "acento" con
  "estado".

  Diseño de un solo tema (oscuro, premium) por decision de marca --
  no es un descuido: fondo y colores se declaran explicitos en :root
  y se usan siempre via variables, nunca como literales sueltos.
*/

@import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap");

:root {
  --onyx: #0b0b0d;
  --carbon: #16151a;
  --carbon-alto: #1f1e24;
  --carbon-alto-2: #26242b;
  --linea: #2c2a32;
  --linea-suave: #221f26;

  --marfil: #f4efe6;
  --piedra: #a29da8;
  --piedra-tenue: #716d78;

  --champan: #c9a15e;
  --champan-vivo: #e4c58a;
  --champan-tenue: rgba(201, 161, 94, 0.14);
  --champan-borde: rgba(201, 161, 94, 0.35);

  --solido: #6fae8b;
  --solido-tenue: rgba(76, 133, 103, 0.16);
  --solido-borde: rgba(111, 174, 139, 0.4);
  --aceptable: #d69b57;
  --aceptable-tenue: rgba(188, 122, 60, 0.16);
  --aceptable-borde: rgba(214, 155, 87, 0.4);
  --debil: #c07871;
  --debil-tenue: rgba(166, 83, 74, 0.18);
  --debil-borde: rgba(192, 120, 113, 0.4);
  --info: #86a3bd;
  --info-tenue: rgba(93, 122, 150, 0.16);
  --info-borde: rgba(134, 163, 189, 0.35);

  --radio-s: 8px;
  --radio-m: 14px;
  --radio-l: 22px;

  --sombra-tarjeta: 0 14px 34px -20px rgba(0, 0, 0, 0.65);
  --sombra-elevada: 0 22px 50px -18px rgba(0, 0, 0, 0.72);

  --fuente-display: "Fraunces", Georgia, "Times New Roman", serif;
  --fuente-cuerpo: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  color-scheme: dark;
  font-size: 16px;
}

* { box-sizing: border-box; }

/* Cualquier elemento con [hidden] debe desaparecer SIEMPRE, incluso
   si su propia clase declara "display" (ej. .aviso, .stepper,
   .boton-secundario usan flex) -- sin esta regla, [hidden] y la
   clase empatan en especificidad y gana quien aparece despues en
   la hoja de estilos. */
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

body {
  margin: 0;
  background: var(--onyx);
  color: var(--marfil);
  font-family: var(--fuente-cuerpo);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 {
  font-family: var(--fuente-display);
  font-weight: 600;
  margin: 0;
  text-wrap: balance;
  color: var(--marfil);
}

.envoltura {
  max-width: 680px;
  margin: 0 auto;
  padding: 1.75rem 1.25rem 4rem;
}

/* ---------------------------------------------------------------- */
/* Encabezado / marca                                               */
/* ---------------------------------------------------------------- */

.marca {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0 0 1.75rem;
}

.marca-marca-svg {
  flex: none;
  width: 42px;
  height: 42px;
}

.marca-texto { min-width: 0; }

.marca-nombre {
  font-family: var(--fuente-display);
  font-size: 1.3rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--marfil);
  line-height: 1.1;
}

.marca-linea {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--champan);
  margin: 0 0.05em;
  transform: translateY(-2px);
}

.marca-tagline {
  margin: 0.2rem 0 0;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--champan);
  opacity: 0.85;
}

/* ---------------------------------------------------------------- */
/* Stepper de progreso                                               */
/* ---------------------------------------------------------------- */

.stepper {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 0 2rem;
  padding: 0;
  position: relative;
}

.stepper::before {
  content: "";
  position: absolute;
  left: 6px;
  right: 6px;
  top: 6px;
  height: 1px;
  background: var(--linea);
}

.stepper::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 6px;
  height: 1px;
  width: var(--avance, 0%);
  background: var(--champan);
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.stepper .paso {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  flex: 1;
}

.stepper .nodo {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--carbon);
  border: 1.5px solid var(--linea);
  transition: all 0.3s ease;
}

.stepper .paso.completo .nodo {
  background: var(--champan);
  border-color: var(--champan);
}

.stepper .paso.activo .nodo {
  border-color: var(--champan);
  box-shadow: 0 0 0 5px var(--champan-tenue);
  transform: scale(1.05);
}

.stepper .etiqueta-nodo {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--piedra-tenue);
  white-space: nowrap;
}

.stepper .paso.activo .etiqueta-nodo,
.stepper .paso.completo .etiqueta-nodo {
  color: var(--champan);
}

/* ---------------------------------------------------------------- */
/* Tarjeta base y paso activo                                        */
/* ---------------------------------------------------------------- */

.superficie {
  background: linear-gradient(180deg, var(--carbon-alto) 0%, var(--carbon) 100%);
  border: 1px solid var(--linea);
  border-radius: var(--radio-l);
  box-shadow: var(--sombra-tarjeta);
}

#asistente {
  padding: 1.75rem 1.5rem 1.5rem;
  animation: entrar-paso 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes entrar-paso {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  display: block;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--champan);
  margin: 0 0 0.5rem;
}

#titulo-paso {
  font-size: 1.35rem;
  margin: 0 0 1.35rem;
}

.opciones {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.65rem;
}

.opciones.opciones--compacta {
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
}

@media (min-width: 480px) {
  .opciones { grid-template-columns: repeat(3, 1fr); }
}

/* Tarjeta de opcion generica (usada por rostro/textura/densidad/grosor) */

.tarjeta-opcion {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  min-height: 96px;
  padding: 1rem 0.6rem 0.8rem;
  border-radius: var(--radio-m);
  border: 1.5px solid var(--linea);
  background: var(--carbon);
  color: var(--marfil);
  font-family: var(--fuente-cuerpo);
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}

.tarjeta-opcion:hover { border-color: var(--champan-borde); }

.tarjeta-opcion:active { transform: scale(0.97); }

.tarjeta-opcion .glifo {
  width: 34px;
  height: 34px;
  color: var(--piedra);
  transition: color 0.18s ease;
}

.tarjeta-opcion.seleccionada {
  border-color: var(--champan);
  background: linear-gradient(180deg, rgba(201, 161, 94, 0.16), rgba(201, 161, 94, 0.05));
  box-shadow: 0 0 0 1px var(--champan) inset, 0 10px 24px -16px rgba(201, 161, 94, 0.5);
}

.tarjeta-opcion.seleccionada .glifo { color: var(--champan-vivo); }

.tarjeta-opcion .marca-check {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--champan);
  color: var(--onyx);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.6);
  transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.tarjeta-opcion.seleccionada .marca-check {
  opacity: 1;
  transform: scale(1);
}

.tarjeta-opcion .marca-check svg { width: 10px; height: 10px; }

/* Variante sin glifo grafico (usada cuando el paso no requiere icono) */
.tarjeta-opcion--simple {
  min-height: 56px;
  flex-direction: row;
  padding: 0 0.9rem;
}

/* ---------------------------------------------------------------- */
/* Navegacion                                                        */
/* ---------------------------------------------------------------- */

.navegacion {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 1.6rem;
}

.boton {
  min-height: 50px;
  border: none;
  border-radius: var(--radio-s);
  font-family: var(--fuente-cuerpo);
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}

.boton:active { transform: scale(0.98); }

.boton-primario {
  flex: 1;
  background: linear-gradient(180deg, var(--champan-vivo), var(--champan));
  color: #1c1509;
  box-shadow: 0 14px 28px -14px rgba(201, 161, 94, 0.55);
}

.boton-primario.procesando {
  transform: scale(0.96);
  opacity: 0.82;
}

.boton-primario:disabled {
  background: var(--carbon-alto-2);
  color: var(--piedra-tenue);
  box-shadow: none;
  cursor: not-allowed;
}

.boton-secundario {
  flex: none;
  background: transparent;
  color: var(--piedra);
  border: 1.5px solid var(--linea);
  padding: 0 1.15rem;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.boton-secundario:hover { color: var(--marfil); border-color: var(--piedra-tenue); }

.boton-fantasma {
  width: 100%;
  background: transparent;
  color: var(--champan);
  border: 1.5px solid var(--champan-borde);
  padding: 0 1.15rem;
}

.boton-fantasma:hover { background: var(--champan-tenue); }

/* ---------------------------------------------------------------- */
/* Mensajes de estado                                                */
/* ---------------------------------------------------------------- */

.aviso {
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  padding: 0.95rem 1.05rem;
  border-radius: var(--radio-m);
  font-size: 0.88rem;
  line-height: 1.5;
  border: 1px solid;
  margin: 0 0 1.1rem;
}

.aviso svg { flex: none; width: 18px; height: 18px; margin-top: 0.1rem; }

.aviso-error { background: var(--debil-tenue); border-color: var(--debil-borde); color: var(--marfil); }
.aviso-error svg { color: var(--debil); }

.aviso-vacio { background: var(--aceptable-tenue); border-color: var(--aceptable-borde); color: var(--marfil); }
.aviso-vacio svg { color: var(--aceptable); }

/* ---------------------------------------------------------------- */
/* Informe de resultados                                             */
/* ---------------------------------------------------------------- */

#resultados { animation: entrar-paso 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

.informe-cabecera { margin: 0 0 1.25rem; }

.informe-cabecera h2 { font-size: 1.5rem; }

.resumen-diagnostico {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--linea);
  border: 1px solid var(--linea);
  border-radius: var(--radio-m);
  overflow: hidden;
  margin: 1rem 0 2rem;
}

@media (min-width: 480px) {
  .resumen-diagnostico { grid-template-columns: repeat(4, 1fr); }
}

.resumen-item {
  background: var(--carbon);
  padding: 0.85rem 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.resumen-item .glifo {
  width: 20px;
  height: 20px;
  color: var(--champan);
}

.resumen-item .resumen-etiqueta {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--piedra-tenue);
}

.resumen-item .resumen-valor {
  font-family: var(--fuente-display);
  font-size: 1.02rem;
  font-weight: 600;
  color: var(--marfil);
}

.titulo-seccion {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--piedra);
  margin: 0 0 1rem;
  padding-left: 0.1rem;
}

.lista-recomendaciones {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  margin: 0 0 1.75rem;
}

.tarjeta-recomendacion {
  position: relative;
  background: var(--carbon);
  border: 1px solid var(--linea);
  border-radius: var(--radio-l);
  padding: 1.35rem 1.3rem 1.5rem;
  box-shadow: var(--sombra-tarjeta);
  opacity: 0;
  transform: translateY(14px);
  animation: entrar-tarjeta 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: var(--retraso, 0ms);
}

@keyframes entrar-tarjeta {
  to { opacity: 1; transform: translateY(0); }
}

.tarjeta-recomendacion--top {
  background: linear-gradient(165deg, var(--carbon-alto-2) 0%, var(--carbon) 65%);
  border: 1.5px solid var(--champan-borde);
  box-shadow: var(--sombra-elevada), 0 0 0 1px rgba(201, 161, 94, 0.12) inset;
  padding: 1.6rem 1.45rem 1.7rem;
}

.tarjeta-recomendacion-cabecera {
  display: flex;
  align-items: flex-start;
  gap: 0.9rem;
  margin-bottom: 0.65rem;
}

.numeral {
  flex: none;
  font-family: var(--fuente-display);
  font-weight: 600;
  font-size: 1.6rem;
  color: var(--piedra-tenue);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.tarjeta-recomendacion--top .numeral {
  font-size: 2.3rem;
  color: var(--champan);
}

.tarjeta-recomendacion-titulos { flex: 1; min-width: 0; }

.tarjeta-recomendacion-titulos h3 {
  font-size: 1.08rem;
  line-height: 1.3;
  margin: 0 0 0.4rem;
}

.tarjeta-recomendacion--top .tarjeta-recomendacion-titulos h3 { font-size: 1.32rem; }

.meta-tarjeta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.55rem;
  margin-top: 0.4rem;
}

.familia {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--piedra-tenue);
}

.insignia {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.3rem 0.65rem;
  border-radius: 999px;
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  border: 1px solid;
  white-space: nowrap;
}

.insignia::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.insignia-solido { background: var(--solido-tenue); border-color: var(--solido-borde); color: var(--solido); }
.insignia-aceptable { background: var(--aceptable-tenue); border-color: var(--aceptable-borde); color: var(--aceptable); }
.insignia-debil { background: var(--debil-tenue); border-color: var(--debil-borde); color: var(--debil); }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0.9rem 0 1.05rem;
}

.chip {
  background: var(--carbon-alto);
  border: 1px solid var(--linea);
  color: var(--piedra);
  padding: 0.28rem 0.65rem;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: capitalize;
}

.bloque-porque { margin: 0 0 0.95rem; }

.bloque-porque .subtitulo-bloque {
  display: block;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--piedra-tenue);
  margin: 0 0 0.35rem;
}

.bloque-porque p {
  margin: 0;
  font-size: 0.92rem;
  line-height: 1.55;
  color: var(--marfil);
}

.nota-tecnica {
  display: flex;
  gap: 0.6rem;
  background: var(--info-tenue);
  border: 1px solid var(--info-borde);
  border-radius: var(--radio-s);
  padding: 0.75rem 0.85rem;
  margin: 0 0 0.95rem;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--marfil);
}

.nota-tecnica svg { flex: none; width: 16px; height: 16px; color: var(--info); margin-top: 0.15rem; }

.advertencias { display: flex; flex-direction: column; gap: 0.5rem; margin: 0 0 1rem; }

.advertencia {
  display: flex;
  gap: 0.6rem;
  background: var(--aceptable-tenue);
  border: 1px solid var(--aceptable-borde);
  border-radius: var(--radio-s);
  padding: 0.7rem 0.85rem;
  font-size: 0.84rem;
  line-height: 1.5;
  color: var(--marfil);
}

.advertencia svg { flex: none; width: 15px; height: 15px; color: var(--aceptable); margin-top: 0.18rem; }

.pie-tarjeta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding-top: 0.85rem;
  margin-top: 0.2rem;
  border-top: 1px solid var(--linea-suave);
}

.pie-tarjeta .glifo { width: 17px; height: 17px; color: var(--champan); }

.pie-tarjeta span {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--piedra);
  text-transform: capitalize;
}

.pie-tarjeta strong { color: var(--marfil); font-weight: 700; }

.nota-pie {
  text-align: center;
  color: var(--piedra-tenue);
  font-size: 0.76rem;
  margin-top: 2.25rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}

.nota-pie svg { width: 13px; height: 13px; }

/* ---------------------------------------------------------------- */
/* Responsive fino                                                   */
/* ---------------------------------------------------------------- */

@media (max-width: 380px) {
  .envoltura { padding: 1.4rem 1rem 3rem; }
  .marca-nombre { font-size: 1.15rem; }
  #titulo-paso { font-size: 1.18rem; }
  .stepper .etiqueta-nodo { display: none; }
  .tarjeta-recomendacion--top .numeral { font-size: 1.9rem; }
}

</style>
</head>
<body>
  <main class="envoltura">
    <header class="marca">
      <span class="marca-marca-svg" id="marca-logo" aria-hidden="true"></span>
      <div class="marca-texto">
        <p class="marca-nombre">VISAGE</p>
        <p class="marca-tagline">Diagnóstico&nbsp;de&nbsp;visagismo</p>
      </div>
    </header>

    <ol class="stepper" id="stepper">
      <li class="paso" data-paso="0"><span class="nodo"></span><span class="etiqueta-nodo">Rostro</span></li>
      <li class="paso" data-paso="1"><span class="nodo"></span><span class="etiqueta-nodo">Textura</span></li>
      <li class="paso" data-paso="2"><span class="nodo"></span><span class="etiqueta-nodo">Densidad</span></li>
      <li class="paso" data-paso="3"><span class="nodo"></span><span class="etiqueta-nodo">Grosor</span></li>
    </ol>

    <section id="asistente" class="superficie">
      <span class="eyebrow" id="eyebrow-paso"></span>
      <h2 id="titulo-paso"></h2>
      <div class="opciones" id="opciones-paso"></div>
      <div class="navegacion">
        <button id="btn-atras" class="boton boton-secundario" type="button" hidden></button>
        <button id="btn-siguiente" class="boton boton-primario" type="button" disabled>Siguiente</button>
      </div>
    </section>

    <p id="error-global" class="aviso aviso-error" hidden></p>

    <section id="resultados" hidden>
      <div class="informe-cabecera">
        <span class="eyebrow">Informe de visagismo</span>
        <h2>Recomendaciones de corte</h2>
      </div>

      <div class="resumen-diagnostico" id="resumen-diagnostico"></div>

      <p id="mensaje-vacio" class="aviso aviso-vacio" hidden></p>

      <div id="bloque-recomendaciones">
        <p class="titulo-seccion">Recomendaciones de corte</p>
        <div id="lista-recomendaciones" class="lista-recomendaciones"></div>
      </div>

      <button id="btn-reiniciar" class="boton boton-fantasma" type="button">Nuevo diagnóstico</button>

        atributo: "densidad",
        real: NOMBRE_DENSIDAD[diagnostico.densidad],
        referencia: NOMBRE_DENSIDAD[corte.densidadReferencia],
      }));
    }
    if (grosorScore === 0 || grosorScore === 1) {
      advertencias.push(formatear(PLANTILLA_ADVERTENCIA[grosorScore], {
        articulo: "el",
        atributo: "grosor",
        real: NOMBRE_GROSOR[diagnostico.grosor],
        referencia: NOMBRE_GROSOR[corte.grosorReferencia],
      }));
    }
    return advertencias;
  }

  function generarExplicacion(candidato, diagnostico) {
    var corte = candidato.corte;
    var mecanismo = MECANISMOS_POR_ID[corte.mecanismoId];
    var excepcion = EXCEPCION_POR_CLAVE[corte.id + "|" + diagnostico.textura];
    return {
      nombre: corte.nombre,
      familia: corte.familia,
      etiqueta: candidato.etiqueta,
      efectos_visagismo: mecanismo.efectos.slice(),
      mecanismo: mecanismo.principioTecnico,
      nota_tecnica_textura: excepcion ? excepcion.texto : null,
      advertencias: calcularAdvertencias(corte, diagnostico, candidato.densidad, candidato.grosor),
      mantenimiento: NOMBRE_MANTENIMIENTO[corte.mantenimiento],
    };
  }

  // -- FASE 5: seleccion final (maximo 3, nunca fabricado) ----------------

  var MENSAJE_CATALOGO_VACIO = (
    "Ningun corte de la base de conocimiento actual cumple simultaneamente con " +
    "el objetivo de visagismo de este rostro y con la viabilidad de esta " +
    "textura/densidad/grosor. Se recomienda que el barbero aplique su criterio " +
    "profesional directamente; este caso queda registrado como un hueco de " +
    "cobertura del catalogo."
  );

  function recomendar(diagnostico) {
    var candidatos = evaluarCandidatos(diagnostico);
    if (candidatos.length === 0) {
      return { recomendaciones: [], mensaje_vacio: MENSAJE_CATALOGO_VACIO };
    }
    var ordenados = ordenar(candidatos);
    var top = ordenados.slice(0, 3);
    var recomendaciones = top.map(function (c) { return generarExplicacion(c, diagnostico); });
    return { recomendaciones: recomendaciones, mensaje_vacio: null };
  }

  return {
    evaluarRostro: evaluarRostro,
    evaluarTextura: evaluarTextura,
    evaluarDensidad: evaluarDensidad,
    evaluarGrosor: evaluarGrosor,
    etiquetar: etiquetar,
    evaluarCandidatos: evaluarCandidatos,
    ordenar: ordenar,
    generarExplicacion: generarExplicacion,
    recomendar: recomendar,
    MENSAJE_CATALOGO_VACIO: MENSAJE_CATALOGO_VACIO,
  };
});

</script>
  <script>
// Puerto a JavaScript de la capa de entrada/salida
// (src/entrada_salida/validacion.py + servicio.py + opciones.py).
// Unico punto de contacto entre la interfaz y el motor -- igual que
// en la version Python, este archivo nunca calcula nada de
// visagismo, solo valida y transporta.
(function (global, factory) {
  if (typeof module !== "undefined" && module.exports) {
    module.exports = factory(require("./motor.js"));
  } else {
    global.ENTRADA_SALIDA = factory(global.MOTOR);
  }
})(typeof window !== "undefined" ? window : globalThis, function (MOTOR) {
  "use strict";

  function DiagnosticoInvalido(mensaje) {
    this.name = "DiagnosticoInvalido";
    this.message = mensaje;
  }
  DiagnosticoInvalido.prototype = Object.create(Error.prototype);
  DiagnosticoInvalido.prototype.constructor = DiagnosticoInvalido;

  var FORMA_ROSTRO_VALORES = ["ovalado", "redondo", "cuadrado", "alargado", "triangular", "corazon"];
  var TEXTURA_VALORES = ["liso", "ondulado", "rizado", "afro"];
  var DENSIDAD_VALORES = ["baja", "media", "alta"];
  var GROSOR_VALORES = ["fino", "medio", "grueso"];

  var DENSIDAD_NOMBRE_A_NUMERO = { baja: 1, media: 2, alta: 3 };
  var GROSOR_NOMBRE_A_NUMERO = { fino: 1, medio: 2, grueso: 3 };

  function normalizar(texto) {
    return String(texto).trim().toLowerCase();
  }

  function mapaDesdeValores(valores) {
    var mapa = {};
    valores.forEach(function (v) { mapa[normalizar(v)] = v; });
    return mapa;
  }

  var MAPA_FORMA_ROSTRO = mapaDesdeValores(FORMA_ROSTRO_VALORES);
  var MAPA_TEXTURA = mapaDesdeValores(TEXTURA_VALORES);

  function resolver(valorCrudo, mapa, nombreCampo, valoresPermitidos) {
    var vacio = valorCrudo === null || valorCrudo === undefined ||
      (typeof valorCrudo === "string" && valorCrudo.trim() === "");
    if (vacio) {
      throw new DiagnosticoInvalido(
        "Falta el campo obligatorio '" + nombreCampo + "'. Valores permitidos: " +
        valoresPermitidos.join(", ") + "."
      );
    }
    var clave = normalizar(valorCrudo);
    if (!Object.prototype.hasOwnProperty.call(mapa, clave)) {
      throw new DiagnosticoInvalido(
        "Valor invalido para '" + nombreCampo + "': '" + valorCrudo + "'. Valores permitidos: " +
        valoresPermitidos.join(", ") + "."
      );
    }
    return mapa[clave];
  }

  function resolverFormaRostro(v) { return resolver(v, MAPA_FORMA_ROSTRO, "forma_rostro", FORMA_ROSTRO_VALORES); }
  function resolverTextura(v) { return resolver(v, MAPA_TEXTURA, "textura", TEXTURA_VALORES); }

  function resolverDensidad(v) {
    var nombre = resolver(v, mapaDesdeValores(DENSIDAD_VALORES), "densidad", DENSIDAD_VALORES);
    return DENSIDAD_NOMBRE_A_NUMERO[nombre];
  }

  function resolverGrosor(v) {
    var nombre = resolver(v, mapaDesdeValores(GROSOR_VALORES), "grosor", GROSOR_VALORES);
    return GROSOR_NOMBRE_A_NUMERO[nombre];
  }

  function construirDiagnostico(rostro, textura, densidad, grosor) {
    return {
      formaRostro: resolverFormaRostro(rostro),
      textura: resolverTextura(textura),
      densidad: resolverDensidad(densidad),
      grosor: resolverGrosor(grosor),
    };
  }

  function generarRecomendacion(rostro, textura, densidad, grosor) {
    var diagnostico = construirDiagnostico(rostro, textura, densidad, grosor);
    return MOTOR.recomendar(diagnostico);
  }

  function etiquetaLegible(valor) {
    return valor.charAt(0).toUpperCase() + valor.slice(1);
  }

  function listaDeOpciones(valores) {
    return valores.map(function (v) { return { valor: v, etiqueta: etiquetaLegible(v) }; });
  }

  function listarOpciones() {
    return {
      forma_rostro: listaDeOpciones(FORMA_ROSTRO_VALORES),
      textura: listaDeOpciones(TEXTURA_VALORES),
      densidad: listaDeOpciones(DENSIDAD_VALORES),
      grosor: listaDeOpciones(GROSOR_VALORES),
    };
  }

  return {
    DiagnosticoInvalido: DiagnosticoInvalido,
    construirDiagnostico: construirDiagnostico,
    generarRecomendacion: generarRecomendacion,
    listarOpciones: listarOpciones,
  };
});

</script>
  <script>
"use strict";

// Capa de PRESENTACION del asistente VISAGE. No calcula nada de
// visagismo: solo arma el DOM alrededor de lo que ya devuelven
// ENTRADA_SALIDA.listarOpciones() y ENTRADA_SALIDA.generarRecomendacion()
// (motor.js / entrada_salida.js, sin tocar). Cambiar este archivo
// nunca puede cambiar una recomendacion, solo como se muestra.

const CAMPOS = ["forma_rostro", "textura", "densidad", "grosor"];

const ETIQUETAS_PASO = {
  forma_rostro: "Forma del rostro",
  textura: "Textura del cabello",
  densidad: "Densidad",
  grosor: "Grosor",
};

const PREGUNTAS_PASO = {
  forma_rostro: "¿Qué forma de rostro tiene el cliente?",
  textura: "¿Qué textura de cabello tiene?",
  densidad: "¿Qué densidad de cabello tiene?",
  grosor: "¿Qué grosor de cabello tiene?",
};

const GLIFOS_POR_CAMPO = {
  forma_rostro: ICONOS.ROSTRO,
  textura: ICONOS.TEXTURA,
  densidad: ICONOS.DENSIDAD,
  grosor: ICONOS.GROSOR,
};

const ETIQUETA_TEXTO = { solido: "Sólido", aceptable: "Aceptable", debil: "Débil" };

// Correcciones tipograficas de presentacion (acentos en español) que
// no existen en el valor crudo del enum (por diseño, los valores del
// catalogo son ASCII: "corazon", no "corazón"). Esto NUNCA se usa
// para calcular nada -- solo para mostrar el nombre correctamente
// escrito; el valor real que via al motor sigue siendo "corazon".
const CORRECCION_TIPOGRAFICA = { Corazon: "Corazón" };

function etiquetaVisible(texto) {
  return CORRECCION_TIPOGRAFICA[texto] || texto;
}

const opciones = ENTRADA_SALIDA.listarOpciones();
let paso = 0;
const seleccion = { forma_rostro: null, textura: null, densidad: null, grosor: null };

const el = (id) => document.getElementById(id);

function opcionPorValor(campo, valor) {
  return opciones[campo].find((o) => o.valor === valor);
}

// -- Marca (logo en el encabezado) -----------------------------------

el("marca-logo").innerHTML = ICONOS.LOGO;
el("nota-pie").innerHTML = ICONOS.UTIL.info + " Todo el cálculo ocurre en este mismo navegador, sin conexión.";

// -- Navegacion entre secciones ---------------------------------------

function mostrarSeccion(idVisible) {
  el("stepper").hidden = idVisible !== "asistente";
  el("asistente").hidden = idVisible !== "asistente";
  el("resultados").hidden = idVisible !== "resultados";
}

function ocultarError() {
  el("error-global").hidden = true;
}

function mostrarError(mensaje) {
  el("error-global").innerHTML = ICONOS.UTIL.error + `<span>${mensaje}</span>`;
  el("error-global").hidden = false;
}

// -- Paso a paso --------------------------------------------------------

function renderPaso() {
  ocultarError();
  mostrarSeccion("asistente");

  const campo = CAMPOS[paso];
  el("eyebrow-paso").textContent = `Paso ${paso + 1} de ${CAMPOS.length} — ${ETIQUETAS_PASO[campo]}`;
  el("titulo-paso").textContent = PREGUNTAS_PASO[campo];

  const contenedor = el("opciones-paso");
  contenedor.innerHTML = "";
  const glifos = GLIFOS_POR_CAMPO[campo];

  opciones[campo].forEach((opcion) => {
    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "tarjeta-opcion";
    if (seleccion[campo] === opcion.valor) boton.classList.add("seleccionada");
    boton.setAttribute("aria-pressed", seleccion[campo] === opcion.valor ? "true" : "false");
    boton.innerHTML =
      `<span class="glifo">${glifos[opcion.valor] || ""}</span>` +
      `<span>${etiquetaVisible(opcion.etiqueta)}</span>` +
      `<span class="marca-check">${ICONOS.UTIL.check}</span>`;
    boton.addEventListener("click", () => seleccionar(campo, opcion.valor));
    contenedor.appendChild(boton);
  });

  actualizarStepper();
  actualizarNavegacion();
}

function seleccionar(campo, valor) {
  seleccion[campo] = valor;
  renderPaso();
}

function actualizarStepper() {
  const avance = (paso / (CAMPOS.length - 1)) * 100;
  el("stepper").style.setProperty("--avance", `${avance}%`);
  document.querySelectorAll("#stepper .paso").forEach((li, indice) => {
    li.classList.toggle("activo", indice === paso);
    li.classList.toggle("completo", indice < paso);
  });
}

function actualizarNavegacion() {
  const campoActual = CAMPOS[paso];
  const btnAtras = el("btn-atras");
  btnAtras.hidden = paso === 0;
  btnAtras.innerHTML = ICONOS.UTIL.flecha + "<span>Atrás</span>";
  el("btn-siguiente").disabled = !seleccion[campoActual];
  el("btn-siguiente").textContent = paso === CAMPOS.length - 1 ? "Generar recomendaciones" : "Siguiente";
}

el("btn-atras").addEventListener("click", () => {
  paso = Math.max(0, paso - 1);
  renderPaso();
});

el("btn-siguiente").addEventListener("click", () => {
  if (paso < CAMPOS.length - 1) {
    paso += 1;
    renderPaso();
  } else {
    generarRecomendaciones();
  }
});

el("btn-reiniciar").addEventListener("click", () => {
  paso = 0;
  CAMPOS.forEach((campo) => { seleccion[campo] = null; });
  renderPaso();
});

// -- Generacion de recomendaciones ---------------------------------------

function generarRecomendaciones() {
  // Micro-interaccion breve en el boton antes de mostrar el informe
  // (el calculo en si es instantaneo: no hay red ni espera real).
  const boton = el("btn-siguiente");
  boton.classList.add("procesando");
  window.setTimeout(() => {
    boton.classList.remove("procesando");
    try {
      const resultado = ENTRADA_SALIDA.generarRecomendacion(
        seleccion.forma_rostro, seleccion.textura, seleccion.densidad, seleccion.grosor,
      );
      mostrarResultados(resultado);
    } catch (error) {
      if (error instanceof ENTRADA_SALIDA.DiagnosticoInvalido) {
        mostrarError(error.message);
      } else {
        mostrarError("Ocurrió un error inesperado generando la recomendación.");
        throw error;
      }
    }
  }, 180);
}

// -- Informe de resultados -----------------------------------------------

function renderResumenDiagnostico() {
  const contenedor = el("resumen-diagnostico");
  contenedor.innerHTML = "";
  CAMPOS.forEach((campo) => {
    const opcion = opcionPorValor(campo, seleccion[campo]);
    const glifo = GLIFOS_POR_CAMPO[campo][seleccion[campo]] || "";
    const item = document.createElement("div");
    item.className = "resumen-item";
    item.innerHTML =
      `<span class="glifo">${glifo}</span>` +
      `<span class="resumen-etiqueta">${ETIQUETAS_PASO[campo]}</span>` +
      `<span class="resumen-valor">${opcion ? etiquetaVisible(opcion.etiqueta) : "—"}</span>`;
    contenedor.appendChild(item);
  });
}

function mostrarResultados(datos) {
  mostrarSeccion("resultados");
  renderResumenDiagnostico();

  const bloqueRecomendaciones = el("bloque-recomendaciones");
  const vacio = el("mensaje-vacio");
  const lista = el("lista-recomendaciones");
  lista.innerHTML = "";

  if (datos.mensaje_vacio) {
    bloqueRecomendaciones.hidden = true;
    vacio.innerHTML = ICONOS.UTIL.advertencia + `<span>${datos.mensaje_vacio}</span>`;
    vacio.hidden = false;
    return;
  }

  vacio.hidden = true;
  bloqueRecomendaciones.hidden = false;
  datos.recomendaciones.forEach((rec, indice) => {
    lista.appendChild(crearTarjetaRecomendacion(rec, indice + 1));
  });

  // Punto de extension preparado para una futura etapa (no
  // implementada aun, sin datos ficticios): aqui se podria anadir,
  // por recomendacion, un bloque "Acabado sugerido" (producto de
  // finalizacion / pomada-cera-arcilla-crema / cuidado) reutilizando
  // la clase .bloque-porque ya definida en estilos.css. No se
  // renderiza nada hasta que exista un dato real del motor para ello.
}

function crearBloque(titulo, texto) {
  const div = document.createElement("div");
  div.className = "bloque-porque";
  div.innerHTML = `<span class="subtitulo-bloque">${titulo}</span><p>${texto}</p>`;
  return div;
}

function crearTarjetaRecomendacion(rec, posicion) {
  const esTop = posicion === 1;
  const tarjeta = document.createElement("article");
  tarjeta.className = "tarjeta-recomendacion" + (esTop ? " tarjeta-recomendacion--top" : "");
  tarjeta.style.setProperty("--retraso", `${(posicion - 1) * 90}ms`);

  const cabecera = document.createElement("div");
  cabecera.className = "tarjeta-recomendacion-cabecera";

  const numeral = document.createElement("span");
  numeral.className = "numeral";
  numeral.textContent = `0${posicion}`;

  const titulos = document.createElement("div");
  titulos.className = "tarjeta-recomendacion-titulos";
  titulos.innerHTML =
    `<h3>${rec.nombre}</h3>` +
    `<div class="meta-tarjeta">` +
    `<span class="insignia insignia-${rec.etiqueta}">${ETIQUETA_TEXTO[rec.etiqueta] || rec.etiqueta}</span>` +
    `<span class="familia">${rec.familia}</span>` +
    `</div>`;

  cabecera.append(numeral, titulos);
  tarjeta.appendChild(cabecera);

  if (rec.efectos_visagismo && rec.efectos_visagismo.length) {
    const chips = document.createElement("div");
    chips.className = "chips";
    rec.efectos_visagismo.forEach((efecto) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = efecto.replace(/_/g, " ");
      chips.appendChild(chip);
    });
    tarjeta.appendChild(chips);
  }

  tarjeta.appendChild(crearBloque("¿Por qué funciona?", rec.mecanismo));

  if (rec.nota_tecnica_textura) {
    const nota = document.createElement("div");
    nota.className = "nota-tecnica";
    nota.innerHTML = ICONOS.UTIL.info + `<span><strong>Nota técnica para esta textura:</strong> ${rec.nota_tecnica_textura}</span>`;
    tarjeta.appendChild(nota);
  }

  if (rec.advertencias && rec.advertencias.length) {
    const bloqueAdvertencias = document.createElement("div");
    bloqueAdvertencias.className = "advertencias";
    rec.advertencias.forEach((texto) => {
      const item = document.createElement("div");
      item.className = "advertencia";
      item.innerHTML = ICONOS.UTIL.advertencia + `<span>${texto}</span>`;
      bloqueAdvertencias.appendChild(item);
    });
    tarjeta.appendChild(bloqueAdvertencias);
  }

  const pie = document.createElement("div");
  pie.className = "pie-tarjeta";
  pie.innerHTML =
    `<span class="glifo">${ICONOS.UTIL.mantenimiento}</span>` +
    `<span>Mantenimiento: <strong>${rec.mantenimiento}</strong></span>`;
  tarjeta.appendChild(pie);

  return tarjeta;
}

renderPaso();

</script>
